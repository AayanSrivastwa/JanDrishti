<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JanDrishti — Citizen-Verified Civic Issue Resolution</title>
    <meta name="description" content="Report, resolve, and verify municipal civic issues with full transparency and citizen audit power." />
    <meta name="theme-color" content="#16845b" />
    <script>
      (function () {
        var THEME_KEY = "jandrishti-theme";
        var saved = localStorage.getItem(THEME_KEY);
        var dark =
          saved === "dark"
            ? true
            : saved === "light"
              ? false
              : window.matchMedia("(prefers-color-scheme: dark)").matches;
        var root = document.documentElement;
        if (dark) {
          root.setAttribute("data-theme", "dark");
          root.classList.add("dark");
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute("content", dark ? "#070d0a" : "#16845b");
        }
      })();
    </script>

    <!-- Google Fonts: Plus Jakarta Sans & Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
